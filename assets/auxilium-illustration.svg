<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 430" role="img" aria-labelledby="auxilium-title auxilium-desc">
  <title id="auxilium-title">Auxilium: a shared gesture of care</title>
  <desc id="auxilium-desc">An original paper-and-ink illustration of two people supporting one care parcel, with red threads connecting their community. The original Auxilium heart-and-parcel logo appears unchanged on the dark parcel face.</desc>
  <defs>
    <pattern id="paper-dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#1c1d1a"/></pattern>
    <pattern id="paper-hatch" width="7" height="7" patternTransform="rotate(32)" patternUnits="userSpaceOnUse"><path d="M0 0V7" stroke="#1c1d1a" stroke-width="1"/></pattern>
    <clipPath id="halo"><circle cx="302" cy="201" r="126"/></clipPath>
  </defs>
  <rect width="600" height="430" fill="#f2efe6"/>
  <!-- One quiet, irregular printed sheet rather than a simulated product screen. -->
  <path d="M49 66 536 47 553 361 65 382Z" fill="#e8e4d8"/>
  <path d="M45 59 528 39 545 351 62 374Z" fill="#faf8f1" stroke="#1c1d1a" stroke-width="1.6"/>
  <path d="m506 40 22-1 2 36-24-16Z" fill="#e2dfd2" stroke="#1c1d1a" stroke-width="1.6"/>
  <path d="m506 40 1 19 23 16" fill="none" stroke="#1c1d1a" stroke-width="1.3"/>
  <path d="M72 93 130 90M75 100l33-2M471 325l43-2M475 332l24-1" stroke="#1c1d1a" stroke-width="1" opacity=".35"/>
  <!-- A single red print impression gives the shared parcel its visual focus. -->
  <circle cx="302" cy="201" r="126" fill="#cd3025"/>
  <g clip-path="url(#halo)" opacity=".2"><path d="M322 70h127v279H322Z" fill="url(#paper-dots)"/></g>
  <path d="M199 127c20-39 54-61 97-65" fill="none" stroke="#1c1d1a" stroke-width="1.5"/>
  <path d="m302 49 1-13m14 17 9-10m-38 9-8-9" stroke="#cd3025" stroke-width="2" stroke-linecap="round"/>
  <!-- Connection thread: the people are the story, the network stays in the margin. -->
  <path d="M91 198C59 161 67 126 96 126c39 0 40 54 12 82M506 200c33-13 40-51 20-65-17-13-39-1-36 16M125 307c29 57 93 73 154 50m45-1c59 14 117-4 147-42" fill="none" stroke="#cd3025" stroke-width="2.3" stroke-linecap="round"/>
  <g fill="#faf8f1" stroke="#cd3025" stroke-width="2"><circle cx="86" cy="136" r="5"/><circle cx="508" cy="129" r="5"/><circle cx="306" cy="359" r="5"/></g>
  <path d="m551 117 9-3m-11 19 10 1M43 255l-10-1m11 14-8 5" fill="none" stroke="#1c1d1a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Left person: an ink jacket and light forearm, angled into the shared gesture. -->
  <g stroke="#1c1d1a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M107 335 102 225c2-19 14-32 34-38l25-1 21 12 24 39-17 90-34 11Z" fill="#1c1d1a" stroke-width="3"/>
    <path d="m132 190 13-11 13-2 13 19-19 24Z" fill="#faf8f1" stroke-width="2.8"/>
    <path d="M145 182v-20l21-4 2 28-9 14Z" fill="#e8e4d8" stroke-width="2.4"/>
    <path d="M125 123c-1-28 11-42 32-39 18 3 26 16 25 36l-1 13 9 11-10 4-2 13c-3 12-16 17-29 9l-16-12Z" fill="#faf8f1" stroke-width="2.8"/>
    <path d="M123 129c-8-11-9-23-3-34-8-14 11-29 29-23 13-10 37 0 38 18 3 10-1 17-8 23l-12-12c-5 12-15 18-28 18l-3 19Z" fill="#1c1d1a" stroke-width="2.5"/>
    <path d="M143 137c-10-10-19-1-14 7 2 5 7 6 12 4" fill="#faf8f1" stroke-width="2.3"/>
    <path d="m137 137-3 4 4 2m36-15 5 1m-3-9 7-1m-18 37 9 1" fill="none" stroke-width="1.5"/>
    <path d="m147 170 8 3m-25 40-4 13m51-17 8 14" fill="none" stroke="#faf8f1" stroke-width="1.5"/>
    <path d="M124 224c-2 14 1 24 11 38l19 23 28-21-20-26-8-22Z" fill="#1c1d1a" stroke-width="2.8"/>
    <path d="m150 278 13 12c7 7 15 10 25 6l55-26 7-16-12-5-61 22-8-11Z" fill="#faf8f1" stroke-width="2.8"/>
    <path d="m161 271 15 15m-2-3 62-26m-44 66 5-33" fill="none" stroke-width="1.5"/>
    <path d="m116 284 3 43m10-29 3 29m9-22 3 22" fill="none" stroke="#faf8f1" stroke-width="1" opacity=".7"/>
  </g>
  <!-- Right person: a lighter work shirt balances the donor's dark silhouette. -->
  <g stroke="#1c1d1a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M409 197c18-7 43-4 56 5l22 27 8 101-63 9-38-10-13-74Z" fill="#faf8f1" stroke-width="3"/>
    <path d="m421 186-7 16 15 23 18-25-12-17Z" fill="#e8e4d8" stroke-width="2.5"/>
    <path d="M423 169v23l10 8 8-11-1-23Z" fill="#faf8f1" stroke-width="2.5"/>
    <path d="M445 118c4-25-7-42-28-41-18 1-27 18-27 34l2 20-8 10 10 4 1 12c3 14 15 20 28 14l15-13Z" fill="#faf8f1" stroke-width="2.8"/>
    <path d="M387 108c-5-15 3-28 16-33 1-18 25-24 33-8 14-3 30 13 26 28l-8 24-15 17-4-24c-18 2-30-4-34-13l-8 10Z" fill="#1c1d1a" stroke-width="2.5"/>
    <path d="M440 134c10-10 19-1 13 8-3 4-7 6-12 4" fill="#faf8f1" stroke-width="2.3"/>
    <path d="m446 134 3 5-4 3m-50-15-5 1m5-12-7-1m22 39-9 1" fill="none" stroke-width="1.5"/>
    <path d="m414 211 16 20 17-21m-17 21 3 60m-16-9 3 48m55-91 9 82m-32-11 27-2" fill="none" stroke-width="1.6"/>
    <path d="M418 225c-8 2-16 9-23 20l-11 15 21 21 26-28 7-16" fill="#faf8f1" stroke-width="2.8"/>
    <path d="m409 273-15 16c-8 8-16 10-26 5l-47-21-6-16 13-5 52 20 10-13Z" fill="#faf8f1" stroke-width="2.8"/>
    <path d="m395 268-14 15m-1-2-53-21m59 38 3 27m9-24 2 24m9-18 1 17" fill="none" stroke-width="1.4"/>
    <path d="m458 95-4 17m-21-40 7 3m-7-8 8 2" fill="none" stroke="#faf8f1" stroke-width="1.3"/>
    <path d="m435 247 10-1m-9 15 9-1m-8 15 9-1" fill="none" stroke-width="1.3"/>
  </g>
  <!-- A folded parcel holds the authentic mark, with its original image bytes. -->
  <g transform="rotate(-5 302 266)" stroke="#1c1d1a" stroke-linejoin="round">
    <path d="m233 200 132 3 14 22-134-1Z" fill="#e8e4d8" stroke-width="2.8"/>
    <path d="m233 200 9 18 131 6" fill="none" stroke-width="1.4"/>
    <path d="m233 220 132 2v108l-130 1Z" fill="#1c1d1a" stroke-width="2.8"/>
    <path d="m365 222 14-11v106l-14 13Z" fill="#e8e4d8" stroke-width="2.8"/>
    <path d="m371 233 1 69m-136 34 131-1 13-14" fill="none" stroke-width="1.2"/>
    <image x="248" y="225" width="105" height="105" xlink:href="data:image/png;base64,"/>
  </g>
  <!-- Small fingers wrap the edges; no oversized hand icon. -->
  <g fill="#faf8f1" stroke="#1c1d1a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="m235 269 12-10c4-4 8-4 10-1 2 4-2 7-7 10l-7 8m-1 0 13-7c5-3 8 3 4 6l-13 8m-1 0 10-4c5-2 7 4 3 7l-13 6-10-9"/>
    <path d="m335 265-12-8c-5-3-9-2-10 2-1 3 4 6 9 9l7 6m0 0-13-6c-5-2-8 3-3 6l13 8m0 0-10-3c-5-2-7 4-2 7l13 5 9-10"/>
  </g>
  <!-- Grounding paper ribbon, slight crease and restrained engraving detail. -->
  <path d="M101 337c119-12 260-15 397-3l-6 11c-135-8-269-6-386 3Z" fill="#e8e4d8" stroke="#1c1d1a" stroke-width="1.5"/>
  <path d="m105 348 3 8 47-3-9-8m341-4-1 11-38-3 8-7" fill="#faf8f1" stroke="#1c1d1a" stroke-width="1.4"/>
  <path d="m107 341 43-3m297 1 43 2M177 349l17-1m225-2 17 1" fill="none" stroke="#1c1d1a" stroke-width="1.1"/>
  <path d="M87 303h17v23H87ZM481 87h19v24h-19Z" fill="url(#paper-hatch)" opacity=".25"/>
  <path d="m61 397 74-3m360-11 40-2" stroke="#1c1d1a" stroke-width="1.3" opacity=".5"/>
</svg>
