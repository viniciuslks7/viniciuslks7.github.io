name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # PR activity must not cancel a main deployment; newer main runs supersede it.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: true
jobs:
  gitguardian:
    name: GitGuardian app approval
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Identify exact checked-out commit
        id: target
        run: node scripts/gitguardian-gate.mjs target
      - name: Require the installed GitGuardian app's successful exact-SHA check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gitguardian-gate.mjs wait
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Identify exact checked-out commit
        id: target
        run: node scripts/gitguardian-gate.mjs target
      - run: npm ci
      - run: npm run test:security
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run preview:standalone
      - run: npm run test:standalone
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ steps.target.outputs.sha }}
          path: dist
  deploy:
    needs: [build, gitguardian]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      checks: read
      pages: write
      id-token: write
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recheck approval and current main for the tested artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
          VERIFIED_SHA: ${{ needs.gitguardian.outputs.sha }}
        run: node scripts/gitguardian-gate.mjs deploy
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ needs.build.outputs.sha }}
